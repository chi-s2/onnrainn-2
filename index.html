<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>あなたに向いているオンライン秘書タイプ診断</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="intro" id="intro">
        <p class="eyebrow">在宅ワークを始めたい方へ</p>
        <h1>あなたに向いている<br />オンライン秘書タイプ診断</h1>
        <p class="lead">
          10個の質問に答えるだけで、今のあなたに合いそうなオンライン秘書の始め方がわかります。
          経験が少なくても大丈夫。できそうな一歩から見つけていきましょう。
        </p>
        <button class="primary-button" type="button" id="startButton">診断をはじめる</button>
      </section>

      <section class="quiz hidden" id="quiz" aria-live="polite">
        <div class="progress-area">
          <p class="question-count" id="questionCount">1 / 10</p>
          <div class="progress-bar" aria-hidden="true">
            <span id="progressFill"></span>
          </div>
        </div>

        <h2 id="questionText"></h2>
        <div class="choices" id="choices"></div>
      </section>

      <section class="result hidden" id="result">
        <p class="eyebrow">診断結果</p>
        <h2 id="resultTitle"></h2>
        <p class="result-copy" id="resultCopy"></p>

        <div class="result-box">
          <h3>おすすめの始め方</h3>
          <ul id="resultSteps"></ul>
        </div>

        <div class="cta-area">
          <a class="primary-button" id="lineButton" href="#" target="_blank" rel="noreferrer">LINEで無料相談する</a>
          <a class="secondary-button" id="noteButton" href="#" target="_blank" rel="noreferrer">noteで詳しく読む</a>
        </div>

        <button class="text-button" type="button" id="restartButton">もう一度診断する</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
